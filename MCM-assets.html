<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shape Assets</title>
    <link rel="stylesheet" href="MCM-style.css">
</head>
<body>
    <!-- ASSETS CONTAINER-->
    <div class="assets-container">

        <!-- ROW 1 - ARCHES-->
        <div class="row">
            <!-- Arch 1 - Solid with cutout -->
            <div class="arch-1">
                <div class="arch-1-negative"></div>
            </div>

            <!-- Arch 2 - Concentric lines -->
            <div class="arch-2">
                <div class="arch-2-a">
                    <div class="arch-2-b">
                        <div class="arch-2-c">
                            <div class="arch-2-d">
                                <div class="arch-2-e">
                                    <div class="arch-2-f">
                                        <div class="arch-2-g">
                                            <div class="arch-2-h">
                                                <div class="arch-2-i"></div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Arch 3 - Outline only -->
            <div class="arch-3"></div>

            <!-- Arch 4 - Solid filled -->
            <div class="arch-4"></div>

            <!-- Arch 5 - Thin outline -->
            <div class="arch-5"></div>
        </div>

        <!-- ROW 2 - DOTS & PATTERNS-->
        <div class="row">
            <!-- Medium circle -->
            <div class="asset-medium-circle"></div>

            <!-- Grid of small dots (5x5) -->
            <div class="dot-grid">
                <span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
                <span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
                <span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
                <span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
                <span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
            </div>

            <!-- Dots arranged in circle - filled -->
            <div class="dot-circle-filled">
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
            </div>

            <!-- Dots arranged in circle - unfilled/outline -->
            <div class="dot-circle-unfilled">
                <span class="dot-outline"></span>
                <span class="dot-outline"></span>
                <span class="dot-outline"></span>
                <span class="dot-outline"></span>
                <span class="dot-outline"></span>
                <span class="dot-outline"></span>
                <span class="dot-outline"></span>
                <span class="dot-outline"></span>
                <span class="dot-outline"></span>
                <span class="dot-outline"></span>
                <span class="dot-outline"></span>
                <span class="dot-outline"></span>
            </div>

            <!-- Single small dot -->
            <div class="dot-single"></div>

            <!-- Circle - bold border -->
                <div class="circle-bold-border"></div>

                <!-- Circle - thin border -->
                <div class="circle-thin-border"></div>

                <!-- Circle - concentric lines -->
                <div class="circle-concentric">
                    <div class="circle-concentric-a">
                        <div class="circle-concentric-b">
                            <div class="circle-concentric-c">
                                <div class="circle-concentric-d">
                                    <div class="circle-concentric-e"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Circle - filled with outline -->
                <div class="circle-filled-outline">
                    <div class="circle-filled-outline-inner"></div>
                </div>

                <!-- Dot circle filled with more dots inside -->
                <div class="dot-circle-filled-interior">
                    <span class="dot"></span>
                    <span class="dot"></span>
                    <span class="dot"></span>
                    <span class="dot"></span>
                    <span class="dot"></span>
                    <span class="dot"></span>
                    <span class="dot"></span>
                    <span class="dot"></span>
                    <span class="dot"></span>
                    <span class="dot"></span>
                    <span class="dot"></span>
                    <span class="dot"></span>
                    <span class="dot-inner"></span>
                    <span class="dot-inner"></span>
                    <span class="dot-inner"></span>
                    <span class="dot-inner"></span>
                    <span class="dot-inner"></span>
                    <span class="dot-inner"></span>
                    <span class="dot-center"></span>
                </div>

                <!-- Hexagonal dot circle-->
                 <div class="dot-hex">
                    <span class="dot"></span>
                    <span class="dot"></span>
                    <span class="dot"></span>
                    <span class="dot"></span>
                    <span class="dot"></span>
                    <span class="dot"></span>
                    <span class="dot-inner"></span>
                    <span class="dot-inner"></span>
                    <span class="dot-inner"></span>
                    <span class="dot-inner"></span>
                    <span class="dot-inner"></span>
                    <span class="dot-inner"></span>
                    <span class="dot-center"></span>
                </div>
        </div>

        <!-- ROW 3 - LINES-->
        <div class="row">
            <!-- Parallel horizontal lines (7 stacked) -->
            <div class="lines-horizontal">
                <span class="line"></span>
                <span class="line"></span>
                <span class="line"></span>
                <span class="line"></span>
                <span class="line"></span>
                <span class="line"></span>
                <span class="line"></span>
            </div>

            <!-- Dotted divider -->
            <div class="asset-dotted-divider"></div>

            <!-- Vertical dotted line -->
            <div class="line-vertical-dotted"></div>

            <!-- Horizontal solid line -->
            <div class="line-horizontal-solid"></div>

            <!-- Diagonal line -->
            <div class="line-diagonal"></div>
        </div>

        <!-- ROW 4 - RECTANGLES & BARS-->
        <div class="row">
            <!-- Rounded rectangle -->
            <div class="asset-rounded-rectangle"></div>

            <!-- Vertical rounded rectangle -->
            <div class="rect-vertical"></div>

            <!-- Horizontal bar/pill shape -->
            <div class="pill-horizontal"></div>

            <!-- Square with rounded corners -->
            <div class="square-rounded"></div>
        </div>

        <!-- ROW 5 - PARTIAL SHAPES-->
        <div class="row">
            <!-- Large semicircle -->
            <div class="asset-semicircle"></div>

            <!-- Quarter circle -->
            <div class="asset-quarter-circle"></div>

            <!-- Half circle left -->
            <div class="half-circle-left"></div>

            <!-- Half circle right -->
            <div class="half-circle-right"></div>

            <!-- Three quarter circle -->
            <div class="three-quarter-circle"></div>

            <!-- Semicircle facing down -->
            <div class="semicircle-down"></div>

            
        </div>

        <!-- ROW 6 - SEMICIRCLE VARIATIONS-->
        <div class="row">
            <!-- Semicircle with concentric lines -->
            <div class="semicircle-concentric">
                <div class="semicircle-concentric-a">
                    <div class="semicircle-concentric-b">
                        <div class="semicircle-concentric-c">
                            <div class="semicircle-concentric-d">
                                <div class="semicircle-concentric-e"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Semicircle down with concentric lines -->
            <div class="semicircle-down-concentric">
                <div class="semicircle-down-concentric-a">
                    <div class="semicircle-down-concentric-b">
                        <div class="semicircle-down-concentric-c">
                            <div class="semicircle-down-concentric-d">
                                <div class="semicircle-down-concentric-e"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Semicircle - filled with outline -->
            <div class="semicircle-filled-outline">
                <div class="semicircle-filled-outline-inner"></div>
            </div>
        </div>

        <!-- ROW 7 - ARCH VARIATIONS-->
        <div class="row">
            <!-- Filled arch with outline -->
            <div class="arch-filled-outline">
                <div class="arch-filled-outline-inner"></div>
            </div>

            <!-- Arch with extended legs -->
            <div class="arch-extended"></div>

            <!-- Window shape (arch on rectangle) -->
            <div class="window-shape">
                <div class="window-arch"></div>
                <div class="window-base"></div>
            </div>
        </div>
        
    </div>

</body>
</html>
