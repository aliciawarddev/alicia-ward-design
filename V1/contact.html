    <link rel="stylesheet" href="components.css">
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="site-header">
        <nav class="site-nav">
            <a href="index.html" class="site-nav-logo">
                <img src="images/logo-white.png" alt="Alicia Ward Design">
            </a>
            <ul class="site-nav-links">
                <li><a href="index.html"><img src="images/house-large.PNG" alt="Home"></a></li> <!-- Added image -->
                <li><a href="gallery.html"><img src="images/picture-frame-large.PNG" alt="Gallery"></a></li> <!-- Added image -->
                <li><a href="digital-gallery.html"><img src="images/ipad-large.PNG" alt="Digital Gallery"></a></li> <!-- Added image -->
                <li><a href="about.html"><img src="images/silhouette-large.PNG" alt="About"></a></li> <!-- Added image -->
                <!-- <li><a href="policies.html">Policies</a></li> -->
                <li><a href="contact.html"><img src="images/envelope-open.PNG" alt="Contact"></a></li> <!-- Added image -->
            </ul>
        </nav>
    </header>

    <main>
        <section class="contact">
            <div class="page-header">
                <h2 class="page-title">Contact</h2>
                <p class="lead">Have a question about my work? I'd love to hear from you.</p>
            </div>

            <div class="contact-layout">
                <!-- Hide until commissions are active
                <div class="contact-aside">
                    <div class="card-secondary">
                        <h3 class="card-secondary-title">Commissions</h3>
                        <p class="card-secondary-text">Looking for a custom piece? Let me know your vision—size, colors, style—and I'll get back to you with availability and pricing.</p>
                    </div>
                    <div class="card-secondary">
                        <h3 class="card-secondary-title">Response Time</h3>
                        <p class="card-secondary-text">I typically respond within 2–3 business days. For urgent inquiries, please note that in your message.</p>
                    </div>
                </div>
                -->
                <form class="contact-form">
                    <div class="form-group">
                        <label for="name" class="form-label">Name</label>
                        <input type="text" id="name" name="name" class="form-input" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" id="email" name="email" class="form-input" required>
                    </div>

                    <div class="form-group">
                        <label for="subject" class="form-label">Subject</label>
                        <select id="subject" name="subject" class="form-select" required>
                            <option value="">Select a subject...</option>
                            <option value="general">Question About My Work</option>
                            <option value="general">General Inquiry</option>
                            <!-- Hide until sales are active
                            <option value="purchase">Purchase Question</option>
                            <option value="commission">Commission Inquiry</option> 
                            <option value="collaboration">Collaboration</option>-->
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="message" class="form-label">Message</label>
                        <textarea id="message" name="message" rows="6" class="form-textarea" required></textarea>
                    </div>
                    
                    <button type="submit" class="btn btn-primary">Send Message</button>
                </form>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="site-footer-content">
            <p>&copy; 2025 Alicia Ward Design. All rights reserved.</p>
            <ul class="site-footer-links">
                <!-- Hide until instagram is set up
                <li><a href="#">Instagram</a></li>-->
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </div>
    </footer>
</body>
</html>
